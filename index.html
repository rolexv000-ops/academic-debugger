<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Debugger v2.0</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #3b82f6; --success: #10b981; --warning: #f59e0b; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        button { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        input, select { background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; margin-top: 5px; }
        .banner { background: #1e1b4b; border-left: 5px solid #6366f1; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 AI-Powered CSE Personal Coach</h1>
    
    <!-- NOTIFICATION ALERT BANNER -->
    <div class="banner" id="notifyBanner">🔔 Allow notifications below to receive daily B.Tech schedule alerts!</div>

    <!-- NOTIFICATION BUTTON -->
    <div class="card">
        <h3>🔔 Step 1: Turn On Mobile Alerts</h3>
        <button onclick="askAlertPermission()" style="background: var(--success);">Enable Direct Alerts</button>
    </div>

    <!-- TIMELINE TRACKER -->
    <div class="card">
        <h3>📅 Step 2: Semester Start Date</h3>
        <input type="date" id="startDate" onchange="runBTechScheduler()">
        <div id="timelineOutput" style="margin-top: 15px; font-size: 0.95rem; line-height: 1.5;"></div>
    </div>

    <!-- AI SHORT NOTES -->
    <div class="card">
        <h3>🧠 Step 3: AI CSE Short Notes</h3>
        <input type="text" id="topicInput" placeholder="Type topic: Pointers, Arrays, Loops...">
        <button onclick="getNotes()" style="margin-top: 10px;">Get Easy Notes</button>
        <div id="notesOutput" style="margin-top: 15px; color: #38bdf8; white-space: pre-wrap; font-family: monospace;"></div>
    </div>
</div>

<script>
    function askAlertPermission() {
        Notification.requestPermission().then(res => {
            if (res === 'granted') {
                alert('🚀 Alerts Activated successfully!');
                new Notification("System Operational", { body: "Your B.Tech Academic Coach is now live." });
            }
        });
    }

    function runBTechScheduler() {
        const dateVal = document.getElementById('startDate').value;
        if (!dateVal) return;

        localStorage.setItem('savedStartDate', dateVal);
        const start = new Date(dateVal);
        const today = new Date();
        
        const mid1 = new Date(start.getTime() + (50 * 24 * 60 * 60 * 1000));
        const endSem = new Date(start.getTime() + (100 * 24 * 60 * 60 * 1000));
        
        const daysToMid1 = Math.ceil((mid1 - today) / (1000 * 60 * 60 * 24));
        const daysToEnd = Math.ceil((endSem - today) / (1000 * 60 * 60 * 24));
        
        let msg = ""; let bannerMsg = "";
        
        if (daysToMid1 > 0) {
            let uDays = Math.ceil(daysToMid1 / 2);
            msg = `⏳ <strong>Mid-1 Exams:</strong> in ${daysToMid1} Days.<br>🎯 <strong>Rule:</strong> Spend ${uDays} days on Unit-1, then clear Unit-2.`;
            bannerMsg = `📚 Mid-1 approaching in ${daysToMid1} days! Lock Unit 1 & 2.`;
            if(Notification.permission === 'granted') { new Notification("📅 Mid-1 Alert", { body: bannerMsg }); }
        } else if (daysToEnd > 0) {
            let uDays = Math.ceil(daysToEnd / 3);
            msg = `⏳ <strong>End-Sem Exams:</strong> in ${daysToEnd} Days.<br>🎯 <strong>Rule:</strong> Spend ${uDays} days per unit for Units 3, 4, 5.`;
            bannerMsg = `⚡ Focus! ${daysToEnd} days left for End-Sem exams.`;
            if(Notification.permission === 'granted') { new Notification("📅 Semester Alert", { body: bannerMsg }); }
        } else {
            msg = "🏁 Semester cycle complete!";
            bannerMsg = "Semester finished successfully.";
        }
        
        document.getElementById('timelineOutput').innerHTML = msg;
        document.getElementById('notifyBanner').innerHTML = `🔔 <strong>Live Alert:</strong> ${bannerMsg}`;
    }

    function getNotes() {
        const t = document.getElementById('topicInput').value.toLowerCase().trim();
        const out = document.getElementById('notesOutput');
        if (t.includes('pointer')) {
            out.textContent = "📝 [POINTERS]\n- Definition: Stores memory address of another variable.\n- Syntax: int *ptr;\n- '&' gets address, '*' gets value.";
        } else if (t.includes('array')) {
            out.textContent = "📝 [ARRAYS]\n- Definition: Continuous block of same data types.\n- Index starts at 0 to (size-1).\n- Fast access time: O(1).";
        } else if (t.includes('loop')) {
            out.textContent = "📝 [LOOPS]\n- Purpose: Repeats code lines until condition fails.\n- Types: For (fixed range), While (conditional).";
        } else {
            out.textContent = "📝 Tip: Try searching for 'Pointers', 'Arrays', or 'Loops' for quick engineering code notes!";
        }
    }

    window.onload = function() {
        if(localStorage.getItem('savedStartDate')) {
            document.getElementById('startDate').value = localStorage.getItem('savedStartDate');
            runBTechScheduler();
        }
    }
</script>
</body>
</html>
